name: Build FrameLock

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, Win32]
        vulkan: [ON]
        include:
          # review4: diagnostic leg. If the ON legs fail only inside vk_layer.cpp / Vulkan-Headers, this leg shows
          # whether the rest of the project (D3D/GL hook, launcher) compiles and links on its own.
          - arch: x64
            vulkan: OFF
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate CMake project
        id: src
        shell: pwsh
        run: |
          if (Test-Path FrameLock/CMakeLists.txt) { $src = "FrameLock" }
          elseif (Test-Path CMakeLists.txt)       { $src = "." }
          else { Write-Error "CMakeLists.txt not found"; exit 1 }
          "src=$src" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Configure (MSVC ${{ matrix.arch }}, Vulkan ${{ matrix.vulkan }})
        run: cmake -S ${{ steps.src.outputs.src }} -B build-${{ matrix.arch }}-vk${{ matrix.vulkan }} -G "Visual Studio 17 2022" -A ${{ matrix.arch }} -DFL_ENABLE_VULKAN=${{ matrix.vulkan }}

      - name: Build (Release)
        run: cmake --build build-${{ matrix.arch }}-vk${{ matrix.vulkan }} --config Release --parallel

      - name: Run portable correctness tests
        run: ctest --test-dir build-${{ matrix.arch }}-vk${{ matrix.vulkan }} -C Release --output-on-failure

      - name: Set up MSVC tools (dumpbin)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch == 'Win32' && 'x86' || 'x64' }}

      - name: Collect binaries
        shell: pwsh
        run: |
          $out = "dist-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $launcher = if ('${{ matrix.arch }}' -eq 'Win32') { 'FrameLock32.exe' } else { 'FrameLock64.exe' }
          $hook = if ('${{ matrix.arch }}' -eq 'Win32') { 'FrameLockHook32.dll' } else { 'FrameLockHook64.dll' }
          Get-ChildItem -Path build-${{ matrix.arch }}-vk${{ matrix.vulkan }} -Recurse -File |
            Where-Object { $_.FullName -match '[\\/]Release[\\/]' -and $_.Name -in @($launcher, $hook) } |
            ForEach-Object { Copy-Item $_.FullName $out -Force }
          Get-ChildItem $out
          if (-not (Get-ChildItem $out -Filter *.exe)) { Write-Error "no launcher exe produced"; exit 1 }
          if (-not (Get-ChildItem $out -Filter FrameLockHook*.dll)) { Write-Error "no hook DLL produced"; exit 1 }

      # review4: the Vulkan loader looks up the layer entry point by its UNDECORATED name. On Win32 an extern "C"
      # __stdcall function is decorated (_name@4); the .def file must re-export it undecorated. Fail the build if not.
      - name: Verify hook DLL exports
        shell: pwsh
        run: |
          foreach ($dll in Get-ChildItem dist-${{ matrix.arch }} -Filter FrameLockHook*.dll) {
            $ex = dumpbin /nologo /exports $dll.FullName | Out-String
            Write-Host $ex
            if ($ex -notmatch '\svkNegotiateLoaderLayerInterfaceVersion\s') { Write-Error "$($dll.Name): undecorated vkNegotiateLoaderLayerInterfaceVersion export missing"; exit 1 }
            if ($ex -match '_vkNegotiateLoaderLayerInterfaceVersion@') { Write-Error "$($dll.Name): export is decorated"; exit 1 }
            $hdr = dumpbin /nologo /headers $dll.FullName | Out-String
            $want = if ('${{ matrix.arch }}' -eq 'Win32') { '14C machine \(x86\)' } else { '8664 machine \(x64\)' }
            if ($hdr -notmatch $want) { Write-Error "$($dll.Name): wrong machine type"; exit 1 }
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FrameLock-${{ matrix.arch }}-vk${{ matrix.vulkan }}
          path: dist-${{ matrix.arch }}/*
          if-no-files-found: error

  # review4: one ready-to-use folder with BOTH architectures side by side. Both launchers must sit next to both hook DLLs
  # so each launcher can register both Vulkan layer manifests (32-bit games started from FrameLock64.exe, and vice versa).
  package:
    needs: build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download x64 + Win32 binaries
        uses: actions/download-artifact@v4
        with:
          pattern: FrameLock-*-vkON
          path: FrameLock-dist
          merge-multiple: true
      - name: Add docs
        shell: pwsh
        run: |
          if (Test-Path FrameLock/README.md) { Copy-Item FrameLock/README.md FrameLock-dist/ }
          if (Test-Path BUILD_AND_STATUS.md) { Copy-Item BUILD_AND_STATUS.md FrameLock-dist/ }
          if (Test-Path FINAL_AUDIT_REPORT.md) { Copy-Item FINAL_AUDIT_REPORT.md FrameLock-dist/ }
          Get-ChildItem FrameLock-dist
          foreach ($f in 'FrameLock64.exe','FrameLock32.exe','FrameLockHook64.dll','FrameLockHook32.dll') {
            if (-not (Test-Path "FrameLock-dist/$f")) { Write-Error "missing $f in combined package"; exit 1 }
          }
      - name: Upload combined package
        uses: actions/upload-artifact@v4
        with:
          name: FrameLock-dist
          path: FrameLock-dist/*
          if-no-files-found: error
